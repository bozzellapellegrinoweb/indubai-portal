<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Area Ambassador — InDubai</title>
<meta name="theme-color" content="#14161a">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/ambassador/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InDubai Ambassador">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<style>
  /* Stessa impostazione della login del portale: fondo scuro, card chiara. */
  .login-page { padding: 24px; padding-top: max(24px, env(safe-area-inset-top)); }
  .login-logo .mark span { color: var(--accent-dark); }
  .login-logo .sub { font-family: 'DM Mono', ui-monospace, monospace; }
  .login-title { font-size: 17px; font-weight: 700; margin-bottom: 22px; }
  /* su fondo scuro il grigio del tema non si legge: schiarito solo qui */
  .foot { text-align: center; margin-top: 20px; font-size: 12px; line-height: 1.7; color: rgba(255,255,255,.5); }
  .foot a { color: rgba(255,255,255,.72); }
</style>
</head>
<body>
  <div class="login-page">
    <div>
      <div class="login-card">
        <div class="login-logo">
          <div class="mark">In<span>Dubai</span></div>
          <div class="sub">Area Ambassador</div>
        </div>

        <div class="login-title" style="text-align:center">Accedi al tuo profilo</div>
        <div id="alert" class="alert alert-danger" style="display:none"></div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="email@esempio.com"
                 autocomplete="email" autocapitalize="off" autocorrect="off">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
        </div>

        <button class="btn btn-accent" style="width:100%;justify-content:center;padding:12px" id="btn">Accedi</button>
      </div>
      <div class="foot">
        Hai perso le credenziali? Scrivi a <a href="mailto:segreteria@indubai.it">segreteria@indubai.it</a><br>
        © InDubai — Platinum Tower, JLT, Dubai
      </div>
    </div>
  </div>

<script src="/ambassador/amb.js"></script>
<script>
(function () {
  var s = amb.getSession();
  if (s && s.access_token && s.ambassador) { location.replace('/ambassador/dashboard.html'); return; }

  var btn = document.getElementById('btn');
  var alertEl = document.getElementById('alert');

  function showAlert(m) { alertEl.textContent = m; alertEl.style.display = 'block'; }

  function doLogin() {
    var email = document.getElementById('email').value.trim();
    var pass = document.getElementById('password').value;
    if (!email || !pass) return showAlert('Inserisci email e password.');

    alertEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Accesso…';

    amb.signIn(email, pass)
      .then(function () { location.href = '/ambassador/dashboard.html'; })
      .catch(function (e) {
        var m = /invalid login/i.test(e.message) ? 'Email o password non corretti.' : e.message;
        showAlert(m);
        btn.disabled = false;
        btn.textContent = 'Accedi';
      });
  }

  btn.addEventListener('click', doLogin);
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
})();
</script>
</body>
</html>
