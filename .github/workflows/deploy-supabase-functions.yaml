name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --yes serve: dalla CLI di novembre 2026 il deploy di piu' di una
      # funzione chiede conferma, e su un runner senza terminale fallisce
      # senza distribuire niente.
      - name: Deploy all edge functions
        run: supabase functions deploy --yes --project-ref gvdoqcgkzbziqufahhxh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
